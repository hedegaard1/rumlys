<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumlys panel (test)</title>
<style>
  :root {
    --primary-color: #f39200; --text-primary-color: #fff; --primary-text-color: #1d1b19; --secondary-text-color: #6b645d;
    --primary-background-color: #efedea; --secondary-background-color: #f6f4f1; --card-background-color: #fff;
    --divider-color: #e0dad2; --ha-card-border-radius: 16px; --ha-card-box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.06);
    --ha-font-family-body: Figtree, system-ui, sans-serif;
  }
  body { margin: 0; }
</style>
</head>
<body>
<rumlys-panel></rumlys-panel>
<script type="module">
  window.rumlysFiler = "/custom_components/rumlys/frontend/";
  const { hass, vedOpdatering } = await import("./mock.js");
  await import("../../custom_components/rumlys/frontend/rumlys-panel.js");
  const panel = document.querySelector("rumlys-panel");
  const rute = () => ({ prefix: "/rumlys", path: location.pathname.indexOf("/rumlys") === 0 ? location.pathname.slice(7) : new URLSearchParams(location.search).get("sti") || "" });
  panel.hass = hass;
  panel.narrow = false;
  panel.route = rute();
  window.addEventListener("location-changed", () => { panel.route = rute(); });
  window.addEventListener("popstate", () => { panel.route = rute(); });
  vedOpdatering(() => { panel.hass = hass; });
</script>
</body>
</html>
